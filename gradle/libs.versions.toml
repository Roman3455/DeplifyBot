[versions]
java = "21"
springframework = "3.5.6"
spring-cloud = "2025.0.0"
dependency-management = "1.1.7"
spring-dotenv = "4.0.0"
sonarqube = "7.0.0.6105"
flyway = "9.22.3"
okhttp = "5.1.0"

[plugins]
java = { id = "java" }
jacoco = { id = "jacoco" }
checkstyle = { id = "checkstyle" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
springframework-boot = { id = "org.springframework.boot", version.ref = "springframework" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
flywaydb = { id = "org.flywaydb.flyway", version.ref = "flyway" }

[libraries]
# === Spring Boot ===
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# === Spring Cloud ===
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
# === Database ===
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# === Utility ===
squareup-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
spring-dotenv = { module = "me.paulschwarz:spring-dotenv", version.ref = "spring-dotenv" }
# === Test ===
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
junit-jupiter = { module = "org.junit.platform:junit-platform-launcher" }
