services:

  bot:
    container_name: deplifybot-app
    build:
      context: .
      dockerfile: Dockerfile
    image: roman3455/deplifybot:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_TEST_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_TEST_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_TEST_PASSWORD}
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      database:
        condition: service_healthy
      ngrok:
        condition: service_started
    networks:
      - bot-network

  database:
    image: postgres:17.0-alpine3.20
    container_name: deplifybot-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: deplifybot
      POSTGRES_USER: ${DB_TEST_USERNAME}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD}
    networks:
      - bot-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_TEST_USERNAME} -d deplifybot" ]
      interval: 10s
      timeout: 5s
      retries: 10

  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: deplifybot-ngrok
    #    command: http notifier-bot:8080 # docker launch
    command: http host.docker.internal:8080 # IDE launch
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
